<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cultura Física Villegas</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3d8ef8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CulturaFisica">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0a0f;
  --surface:#12121a;
  --card:#1a1a26;
  --border:#252535;
  --accent:#3d8ef8;
  --accent2:#5ba3ff;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#f59e0b;
  --text:#e8e8f0;
  --muted:#7070a0;
  --white:#ffffff;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;}

/* SPLASH */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
#splash img{width:110px;height:110px;border-radius:50%;margin-bottom:18px;border:3px solid var(--accent);}
#splash h1{font-size:1.5rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--white);}
#splash p{color:var(--muted);margin-top:5px;font-size:.85rem;letter-spacing:1px;}
.splash-bar{width:180px;height:3px;background:var(--border);border-radius:2px;margin-top:24px;overflow:hidden;}
.splash-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width 1.2s ease;}

/* LOGIN */
#loginScreen{display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;padding:20px;}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:30px 24px;width:100%;max-width:340px;}
.login-logo{text-align:center;margin-bottom:20px;}
.login-logo img{width:72px;height:72px;border-radius:50%;border:2px solid var(--accent);}
.login-logo h2{margin-top:10px;font-size:1rem;font-weight:700;letter-spacing:1px;color:var(--white);}
.login-logo p{color:var(--muted);font-size:.75rem;margin-top:3px;}
.role-tabs{display:flex;background:var(--surface);border-radius:10px;padding:3px;margin-bottom:20px;}
.role-tab{flex:1;padding:9px;text-align:center;border-radius:7px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted);border:none;background:transparent;transition:all .2s;}
.role-tab.active{background:var(--accent);color:var(--white);}
.inp-group{margin-bottom:13px;}
.inp-group label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
.inp-group input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 13px;color:var(--text);font-size:.92rem;outline:none;transition:border .2s;}
.inp-group input:focus{border-color:var(--accent);}
.btn-primary{width:100%;background:var(--accent);color:var(--white);border:none;border-radius:10px;padding:13px;font-size:.95rem;font-weight:700;cursor:pointer;transition:background .2s;}
.btn-primary:hover{background:var(--accent2);}
.login-error{color:var(--red);font-size:.8rem;text-align:center;margin-top:9px;display:none;}

/* APP SHELL */
#appShell{display:none;min-height:100vh;flex-direction:column;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-left{display:flex;align-items:center;gap:9px;}
.topbar-left img{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);}
.topbar-title{font-size:.88rem;font-weight:700;color:var(--white);}
.topbar-sub{font-size:.7rem;color:var(--muted);}
.topbar-right{display:flex;gap:7px;align-items:center;}
.icon-btn{background:var(--card);border:1px solid var(--border);border-radius:7px;width:33px;height:33px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:1rem;}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.main-content{flex:1;max-width:600px;margin:0 auto;width:100%;}
.bottom-nav{background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0;position:sticky;bottom:0;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 10px;cursor:pointer;color:var(--muted);font-size:.65rem;font-weight:600;border:none;background:transparent;transition:color .2s;}
.nav-item.active{color:var(--accent);}
.nav-icon{font-size:1.2rem;}

/* HERO ALUMNO */
.hero{position:relative;background:linear-gradient(160deg,#0d1f3c 0%,#111128 60%,#0a0a0f 100%);padding:22px 16px 18px;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(61,142,248,.3),transparent 70%);border-radius:50%;}
.hero::after{content:'';position:absolute;bottom:-20px;left:-20px;width:100px;height:100px;background:radial-gradient(circle,rgba(91,163,255,.15),transparent 70%);border-radius:50%;}
.hero-saludo{font-size:.7rem;color:rgba(255,255,255,.45);letter-spacing:2px;text-transform:uppercase;margin-bottom:2px;}
.hero-nombre{font-size:1.8rem;font-weight:800;color:var(--white);margin-bottom:8px;line-height:1.1;}
.hero-badges{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.hero-badge{font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:20px;}
.badge-activo{background:rgba(61,142,248,.2);border:1px solid var(--accent);color:var(--accent);}
.badge-aldia{background:rgba(34,197,94,.2);border:1px solid var(--green);color:var(--green);}
.badge-debe{background:rgba(239,68,68,.2);border:1px solid var(--red);color:var(--red);}
.hero-accesos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.acceso-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:11px 6px;text-align:center;cursor:pointer;transition:all .2s;}
.acceso-btn:hover{border-color:var(--accent);background:rgba(61,142,248,.12);}
.acceso-icon{font-size:1.3rem;margin-bottom:4px;}
.acceso-label{font-size:.64rem;color:rgba(255,255,255,.6);font-weight:600;}

/* CARNET */
.pad{padding:14px 16px;}
.carnet{background:linear-gradient(135deg,#1a2a4a 0%,#0d1b35 50%,#1a1a26 100%);border:1px solid var(--accent);border-radius:14px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden;}
.carnet::before{content:'';position:absolute;top:-20px;right:-20px;width:100px;height:100px;background:radial-gradient(circle,rgba(61,142,248,.2),transparent 70%);border-radius:50%;}
.carnet-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.carnet-avatar{width:46px;height:46px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:800;color:var(--white);border:2px solid rgba(255,255,255,.2);flex-shrink:0;}
.carnet-name{font-size:1rem;font-weight:800;color:var(--white);}
.carnet-badge-sm{display:inline-block;background:rgba(61,142,248,.2);border:1px solid var(--accent);color:var(--accent);font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:3px;}
.carnet-logo-big{width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.3);margin-left:auto;flex-shrink:0;}
.carnet-datos{display:flex;gap:20px;margin-bottom:14px;padding:12px 0;border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);}
.carnet-dato{flex:1;}
.carnet-dato-label{font-size:.62rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px;}
.carnet-dato-val{font-size:.85rem;font-weight:700;color:var(--white);margin-top:2px;}
.carnet-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
.carnet-footer-info{font-size:.7rem;color:rgba(255,255,255,.5);}
.carnet-footer-info strong{color:var(--white);font-size:.85rem;}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
.card-title{font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.section-title{font-size:1rem;font-weight:800;color:var(--white);margin-bottom:12px;display:flex;align-items:center;gap:7px;}

/* MI CUENTA - CUOTAS */
.cuota-item{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border .2s;}
.cuota-item.selected{border-color:var(--accent);background:rgba(61,142,248,.06);}
.cuota-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.cuota-check.checked{background:var(--accent);border-color:var(--accent);}
.cuota-check-mark{color:var(--white);font-size:.65rem;font-weight:900;}
.cuota-info{flex:1;}
.cuota-nombre{font-size:.88rem;font-weight:700;color:var(--text);}
.cuota-detalle{font-size:.72rem;color:var(--muted);margin-top:2px;}
.cuota-monto{font-size:.92rem;font-weight:800;color:var(--white);}
.cuota-estado{font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:20px;margin-top:3px;display:inline-block;}
.estado-pendiente{background:rgba(239,68,68,.15);color:var(--red);}
.estado-pagado{background:rgba(34,197,94,.15);color:var(--green);}

.total-pagar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.total-label{font-size:.75rem;color:var(--muted);font-weight:700;text-transform:uppercase;}
.total-monto{font-size:1.3rem;font-weight:800;color:var(--white);}

.btn-pagar{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#009EE3,#00b4f0);color:var(--white);border:none;border-radius:10px;padding:14px 18px;font-size:.95rem;font-weight:700;cursor:pointer;width:100%;justify-content:center;transition:opacity .2s;}
.btn-pagar:hover{opacity:.9;}
.btn-pagar:disabled{opacity:.4;cursor:not-allowed;}

/* SALDO TOTAL */
.saldo-card{background:linear-gradient(135deg,rgba(239,68,68,.1),rgba(239,68,68,.05));border:1px solid rgba(239,68,68,.3);border-radius:12px;padding:14px;margin-bottom:12px;}
.saldo-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;}
.saldo-monto{font-size:2rem;font-weight:800;color:var(--red);margin-top:4px;}
.saldo-aldia{color:var(--green);}

/* NOVEDADES */
.novedad-item{padding:10px 0;border-bottom:1px solid var(--border);}
.novedad-item:last-child{border-bottom:none;}
.novedad-fecha{font-size:.68rem;color:var(--accent);font-weight:700;margin-bottom:2px;}
.novedad-texto{font-size:.85rem;color:var(--text);}

/* MENÚ LATERAL */
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;}
.sidebar{position:fixed;top:0;left:-280px;width:260px;height:100vh;background:var(--surface);border-right:1px solid var(--border);z-index:300;transition:left .25s ease;display:flex;flex-direction:column;padding:0;}
.sidebar.open{left:0;}
.sidebar-header{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.sidebar-header img{width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);}
.sidebar-user-name{font-size:.9rem;font-weight:700;color:var(--white);}
.sidebar-user-sub{font-size:.72rem;color:var(--muted);}
.sidebar-menu{flex:1;padding:12px 8px;overflow-y:auto;}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:.85rem;font-weight:600;border:none;background:transparent;width:100%;text-align:left;transition:all .2s;}
.sidebar-item:hover,.sidebar-item.active{background:rgba(61,142,248,.1);color:var(--accent);}
.sidebar-item-icon{font-size:1.1rem;width:22px;text-align:center;}
.sidebar-footer{padding:12px 8px;border-top:1px solid var(--border);}
.sidebar-logout{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;cursor:pointer;color:var(--red);font-size:.85rem;font-weight:600;border:none;background:transparent;width:100%;}

/* ADMIN */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px;text-align:center;}
.stat-num{font-size:1.6rem;font-weight:800;color:var(--accent);}
.stat-label{font-size:.68rem;color:var(--muted);font-weight:600;text-transform:uppercase;margin-top:1px;}
.stat-green .stat-num{color:var(--green);}
.stat-red .stat-num{color:var(--red);}
.stat-yellow .stat-num{color:var(--yellow);}

.alumno-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.alumno-row:last-child{border-bottom:none;}
.alumno-info{display:flex;align-items:center;gap:9px;}
.alumno-avatar{width:35px;height:35px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--white);flex-shrink:0;}
.alumno-nombre{font-size:.88rem;font-weight:700;color:var(--text);}
.alumno-nivel{font-size:.72rem;color:var(--muted);}
.alumno-actions{display:flex;gap:5px;}
.action-btn{border:none;border-radius:7px;padding:5px 10px;font-size:.72rem;font-weight:700;cursor:pointer;}
.btn-verde{background:rgba(34,197,94,.15);color:var(--green);border:1px solid var(--green);}
.btn-rojo{background:rgba(239,68,68,.15);color:var(--red);border:1px solid var(--red);}
.btn-azul{background:rgba(61,142,248,.15);color:var(--accent);border:1px solid var(--accent);}

/* FORMULARIOS */
.form-row{margin-bottom:12px;}
.form-row label{display:block;font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.form-row input,.form-row select,.form-row textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:.88rem;outline:none;transition:border .2s;}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--accent);}
.form-row textarea{resize:vertical;min-height:70px;}
.form-row select option{background:var(--surface);}
.btn-submit{background:var(--accent);color:var(--white);border:none;border-radius:9px;padding:12px 18px;font-size:.88rem;font-weight:700;cursor:pointer;width:100%;}
.btn-cancel{background:var(--surface);color:var(--muted);border:1px solid var(--border);border-radius:9px;padding:12px 18px;font-size:.88rem;font-weight:700;cursor:pointer;width:100%;margin-top:7px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:.95rem;font-weight:800;color:var(--white);margin-bottom:16px;}

/* MISC */
.badge{font-size:.68rem;font-weight:700;padding:2px 9px;border-radius:20px;}
.badge-green{background:rgba(34,197,94,.2);color:var(--green);}
.badge-red{background:rgba(239,68,68,.2);color:var(--red);}
.badge-yellow{background:rgba(245,158,11,.2);color:var(--yellow);}
.empty-state{text-align:center;padding:30px 20px;color:var(--muted);}
.empty-icon{font-size:2rem;margin-bottom:8px;}
.hidden{display:none !important;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--white);padding:9px 20px;border-radius:30px;font-size:.82rem;font-weight:700;z-index:1000;display:none;white-space:nowrap;}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <img id="splashLogo" src="" alt="Logo">
  <h1>Cultura Física</h1>
  <p>Villegas</p>
  <div class="splash-bar"><div class="splash-fill" id="splashFill"></div></div>
</div>

<!-- LOGIN -->
<div id="loginScreen" style="display:none;min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;">
  <div class="login-box">
    <div class="login-logo">
      <img id="loginLogo" src="" alt="Logo">
      <h2>Cultura Física</h2>
      <p>Villegas</p>
    </div>
    <div class="role-tabs">
      <button class="role-tab active" id="tabProfe" onclick="setRole('profe')">Profe</button>
      <button class="role-tab" id="tabAlumno" onclick="setRole('alumno')">Alumno</button>
    </div>
    <div id="grpUser" class="inp-group" style="display:none;">
      <label>DNI</label>
      <input type="text" id="inpUser" placeholder="Tu numero de DNI">
    </div>
    <div class="inp-group">
      <label>Contraseña</label>
      <input type="password" id="inpPass" placeholder="Contraseña">
    </div>
    <button class="btn-primary" onclick="doLogin()">Ingresar</button>
    <p class="login-error" id="loginErr">Usuario o contraseña incorrectos</p>
    <div style="margin-top:20px;text-align:center;border-top:1px solid var(--border);padding-top:14px;">
      <button onclick="resetearDatos()" style="background:transparent;border:none;color:var(--muted);font-size:.72rem;cursor:pointer;text-decoration:underline;">Resetear datos de prueba</button>
    </div>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <img id="sidebarLogo" src="" alt="">
    <div>
      <div class="sidebar-user-name" id="sidebarNombre"></div>
      <div class="sidebar-user-sub">Cultura Fisica Villegas</div>
    </div>
  </div>
  <div class="sidebar-menu" id="sidebarMenu"></div>
  <div class="sidebar-footer">
    <button class="sidebar-logout" onclick="doLogout()">&#x1F6AA; Cerrar sesion</button>
  </div>
</div>

<!-- APP SHELL -->
<div id="appShell" style="display:none;flex-direction:column;min-height:100vh;">
  <div class="topbar">
    <div class="topbar-left">
      <div class="icon-btn" onclick="openSidebar()" style="margin-right:2px;">&#9776;</div>
      <img id="topLogo" src="" alt="">
      <div>
        <div class="topbar-title">Cultura Fisica</div>
        <div class="topbar-sub" id="topSub">Villegas</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="icon-btn" onclick="doLogout()" title="Salir">&#x2715;</div>
    </div>
  </div>

  <div class="main-content" id="mainContent"></div>
  <div class="bottom-nav" id="bottomNav"></div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalBody"></div>
  </div>

function getDB() {
  var raw = localStorage.getItem(DB_KEY);
  if (!raw) return initDB();
  return JSON.parse(raw);
}
function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }

function initDB() {
  var db = {
    config: { mpLink: "https://mpago.la/TU_LINK_AQUI", cuotaMonto: 8000 },
    alumnos: [
      {id:1,nombre:"Maria Gomez",dni:"30123456",pass:"1234",nivel:"Inicial",turno:"Lunes y Miercoles 18hs",pagos:{},activo:true},
      {id:2,nombre:"Lucas Perez",dni:"32456789",pass:"1234",nivel:"Intermedio",turno:"Martes y Jueves 17hs",pagos:{},activo:true},
      {id:3,nombre:"Sofia Torres",dni:"35789012",pass:"1234",nivel:"Avanzado",turno:"Lunes y Miercoles 19hs",pagos:{},activo:true}
    ],
    novedades: [
      {id:1,texto:"Bienvenidos al nuevo sistema de gestion del gimnasio",fecha:"2026-06-01"},
      {id:2,texto:"Este mes no hay clases el dia 20 de junio",fecha:"2026-06-10"}
    ]
  };
  // Maria: pagada este mes y los 3 anteriores
  var hoy = new Date();
  var key = mesKey(hoy);
  db.alumnos[0].pagos[key] = "pagado";
  for(var m=1;m<=3;m++){
    var d=new Date(hoy.getFullYear(),hoy.getMonth()-m,1);
    db.alumnos[0].pagos[mesKey(d)]="pagado";
  }
  // Sofia: pagada este mes
  db.alumnos[2].pagos[key] = "pagado";
  // Lucas: debe este mes y el anterior (demo de deuda acumulada)
  var mesAnterior = new Date(hoy.getFullYear(),hoy.getMonth()-1,1);
  db.alumnos[1].pagos[mesKey(mesAnterior)] = "pendiente";
  saveDB(db);
  return db;
}

function mesKey(d) { return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function mesLabel(key) {
  var m=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  var p=key.split("-"); return m[parseInt(p[1])-1]+" "+p[0];
}
function estadoPago(alumno) { return alumno.pagos[mesKey(new Date())]||"pendiente"; }
function getSession() { var r=sessionStorage.getItem(SESSION_KEY); return r?JSON.parse(r):null; }
function saveSession(s) { sessionStorage.setItem(SESSION_KEY,JSON.stringify(s)); }

function setLogos() {
  var ids=["splashLogo","loginLogo","topLogo","sidebarLogo"];
  for(var i=0;i<ids.length;i++){var el=document.getElementById(ids[i]);if(el)el.src=LOGO_SRC;}
}

function runSplash() {
  setLogos();
  var fill=document.getElementById("splashFill");
  setTimeout(function(){fill.style.width="100%";},100);
  setTimeout(function(){
    var sess=getSession();
    if(sess){currentUser=sess;showApp();}
    else{
      document.getElementById("splash").style.display="none";
      var ls=document.getElementById("loginScreen");
      ls.style.display="flex";
    }
  },1500);
}

function setRole(r) {
  currentRole=r;
  document.getElementById("tabProfe").className="role-tab"+(r==="profe"?" active":"");
  document.getElementById("tabAlumno").className="role-tab"+(r==="alumno"?" active":"");
  document.getElementById("grpUser").style.display=r==="alumno"?"block":"none";
  document.getElementById("inpUser").value="";
  document.getElementById("inpPass").value="";
  document.getElementById("loginErr").style.display="none";
}

function doLogin() {
  var pass=document.getElementById("inpPass").value;
  var err=document.getElementById("loginErr");
  err.style.display="none";
  if(currentRole==="profe") {
    if(pass==="admin123"){currentUser={role:"profe",nombre:"Profe"};saveSession(currentUser);showApp();}
    else err.style.display="block";
  } else {
    var dni=document.getElementById("inpUser").value;
    var db=getDB();
    var found=null;
    for(var i=0;i<db.alumnos.length;i++){if(db.alumnos[i].dni===dni&&db.alumnos[i].pass===pass&&db.alumnos[i].activo){found=db.alumnos[i];break;}}
    if(found){currentUser={role:"alumno",id:found.id,nombre:found.nombre};saveSession(currentUser);showApp();}
    else err.style.display="block";
  }
}

function doLogout() {
  sessionStorage.removeItem(SESSION_KEY);
  currentUser=null;
  closeSidebar();
  document.getElementById("appShell").style.display="none";
  var ls=document.getElementById("loginScreen");
  ls.style.display="flex";
  document.getElementById("inpPass").value="";
  document.getElementById("inpUser").value="";
  setRole("profe");
}

function showApp() {
  document.getElementById("splash").style.display="none";
  document.getElementById("loginScreen").style.display="none";
  var app=document.getElementById("appShell");
  app.style.display="flex";
  setLogos();
  document.getElementById("sidebarNombre").textContent=currentUser.nombre;
  if(currentUser.role==="profe"){
    document.getElementById("topSub").textContent="Panel Profe";
    buildNavProfe();
    buildSidebarProfe();
    showTabProfe("dashboard");
  } else {
    document.getElementById("topSub").textContent=currentUser.nombre;
    buildNavAlumno();
    buildSidebarAlumno();
    showTabAlumno("inicio");
  }
}

}

/* INICIO ALUMNO - HERO */
function buildInicio() {
  var db=getDB();
  var alumno=null;
  for(var i=0;i<db.alumnos.length;i++){if(db.alumnos[i].id===currentUser.id){alumno=db.alumnos[i];break;}}
  if(!alumno) return "<p>Error</p>";
  var est=estadoPago(alumno);
  var hora=new Date().getHours();
  var saludo=hora<12?"Buenos dias":hora<20?"Buenas tardes":"Buenas noches";
  var primerNombre=alumno.nombre.split(" ")[0];

  var html='<div class="hero">'+
    '<div class="hero-saludo">'+saludo+'</div>'+
    '<div class="hero-nombre">'+primerNombre+'</div>'+
    '<div class="hero-badges">'+
    '<span class="hero-badge badge-activo">ACTIVO</span>'+
    (est==="pagado"?'<span class="hero-badge badge-aldia">&#x2022; Al dia</span>':'<span class="hero-badge badge-debe">&#x2022; Cuota pendiente</span>')+
    '</div>'+
    '<div class="hero-accesos">'+
    '<div class="acceso-btn" onclick="showTabAlumno(\'carnet\')"><div class="acceso-icon">&#x1F4CB;</div><div class="acceso-label">Mi Carnet</div></div>'+
    '<div class="acceso-btn" onclick="showTabAlumno(\'micuenta\')"><div class="acceso-icon">&#x1F4B3;</div><div class="acceso-label">Mi Cuenta</div></div>'+
    '<div class="acceso-btn" onclick="showTabAlumno(\'novedades\')"><div class="acceso-icon">&#x1F4E2;</div><div class="acceso-label">Novedades</div></div>'+
    '</div></div>';

  var novs=db.novedades.slice(-2).reverse();
  html+='<div class="pad">';
  if(novs.length>0){
    html+='<div class="section-title">&#x1F4E2; Ultimas novedades</div><div class="card">';
    for(var j=0;j<novs.length;j++){
      html+='<div class="novedad-item"><div class="novedad-fecha">'+novs[j].fecha+'</div><div class="novedad-texto">'+novs[j].texto+'</div></div>';
    }
    html+='</div>';
  }
  html+='</div>';
  return html;
}

/* CARNET */
function buildCarnet() {
  var db=getDB();
  var alumno=null;
  for(var i=0;i<db.alumnos.length;i++){if(db.alumnos[i].id===currentUser.id){alumno=db.alumnos[i];break;}}
  if(!alumno) return "<p>Error</p>";
  var iniciales=alumno.nombre.split(" ").map(function(n){return n[0];}).join("").substring(0,2).toUpperCase();
  var est=estadoPago(alumno);
  var key=mesKey(new Date());
  var qrData="CFV|"+alumno.id+"|"+alumno.nombre+"|"+alumno.dni+"|"+(est==="pagado"?"ALDÍA":"DEBE");
  var qrUrl="https://api.qrserver.com/v1/create-qr-code/?size=90x90&data="+encodeURIComponent(qrData)+"&bgcolor=1a2a4a&color=ffffff&margin=4";

  return '<div class="section-title">&#x1F4CB; Mi Carnet</div>'+
    '<div class="carnet">'+

function buildMCTab_Estado(alumno,db) {
  var monto=db.config.cuotaMonto;
  var hoy=new Date();
  var mesesPendientes=[];
  for(var m=5;m>=0;m--){
    var d=new Date(hoy.getFullYear(),hoy.getMonth()-m,1);
    var k=mesKey(d);
    var v=alumno.pagos[k];
    if(v==="pendiente"||(m===0&&v!=="pagado")){
      mesesPendientes.push({key:k,label:mesLabel(k),monto:monto});
    }
  }
  var totalDeuda=mesesPendientes.length*monto;
  var html='';
  if(totalDeuda>0){
    html+='<div class="saldo-card"><div class="saldo-label">Saldo total adeudado</div><div class="saldo-monto">$'+totalDeuda.toLocaleString("es-AR")+',00</div></div>';
  } else {
    html+='<div class="saldo-card" style="border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.05);"><div class="saldo-label">Estado de cuenta</div><div class="saldo-monto saldo-aldia">Al dia</div></div>';
  }
  html+='<div style="font-size:.88rem;font-weight:800;color:var(--white);margin-bottom:10px;">A pagar</div>';
  if(mesesPendientes.length===0){
    html+='<div class="card"><div class="empty-state"><div class="empty-icon">&#x2705;</div><div style="color:var(--green);font-weight:700;">Sin cuotas pendientes</div></div></div>';
  } else {
    for(var i=0;i<mesesPendientes.length;i++){
      var mp=mesesPendientes[i];
      var sel=cuotasSeleccionadas[mp.key]||false;
      html+='<div class="cuota-item'+(sel?" selected":"")+'" onclick="toggleCuota(\''+mp.key+'\')" id="cuota_'+mp.key+'">'+
        '<div class="cuota-check'+(sel?" checked":"")+'" id="check_'+mp.key+'">'+(sel?'<span class="cuota-check-mark">&#x2713;</span>':'')+
        '</div>'+
        '<div class="cuota-info"><div class="cuota-nombre">Cuota '+mp.label+'</div><div class="cuota-detalle">&#x1F4C5; Vence fin de mes</div></div>'+
        '<div style="text-align:right;"><div class="cuota-monto">+ $'+mp.monto.toLocaleString("es-AR")+',00</div>'+
        '<span class="cuota-estado estado-pendiente">&#x23F0; PENDIENTE</span></div></div>';
    }
    html+='<div class="total-pagar" id="totalPagarBox"><div><div class="total-label">Total seleccionado</div><div class="total-monto" id="totalMonto">$0</div></div><div style="font-size:.72rem;color:var(--muted);" id="cantSelec">0 items</div></div>';
    html+='<button class="btn-pagar" id="btnPagarMP" onclick="pagarMP()" disabled>&#x1F4B3; Pagar con Mercado Pago</button>';
  }
  // Historial
  html+='<div style="font-size:.88rem;font-weight:800;color:var(--white);margin:14px 0 10px;">Historial de pagos</div><div class="card">';
  var keys=Object.keys(alumno.pagos).sort().reverse();
  if(keys.length===0){html+='<div class="empty-state"><div class="empty-icon">&#x1F4C5;</div><div>Sin pagos registrados</div></div>';}
  else{for(var j=0;j<Math.min(keys.length,6);j++){var k2=keys[j];var v2=alumno.pagos[k2];html+='<div class="alumno-row"><div style="font-size:.85rem;font-weight:700;">'+mesLabel(k2)+'</div><span class="badge '+(v2==="pagado"?"badge-green":"badge-red")+'">'+(v2==="pagado"?"Pagado":"Pendiente")+'</span></div>';}}
  html+='</div>';
  return html;
}

function cambiarPassword(id) {
  var actual=document.getElementById("passActual").value;
  var nueva=document.getElementById("passNueva").value;
  var confirm=document.getElementById("passConfirm").value;
  if(!actual||!nueva||!confirm){showToast("Completa todos los campos");return;}
  if(nueva!==confirm){showToast("Las contrasenas no coinciden");return;}
  if(nueva.length<4){showToast("Minimo 4 caracteres");return;}
  var db=getDB();
  for(var i=0;i<db.alumnos.length;i++){
    if(db.alumnos[i].id===id){
      if(db.alumnos[i].pass!==actual){showToast("Contrasena actual incorrecta");return;}
      db.alumnos[i].pass=nueva;
      break;
    }
  }
  saveDB(db);
  showToast("Contrasena actualizada");
  document.getElementById("passActual").value="";
  document.getElementById("passNueva").value="";
  document.getElementById("passConfirm").value="";
}

  }
  saveDB(db);
  showToast("Numero guardado");
}

function toggleCuota(key) {
  cuotasSeleccionadas[key]=!cuotasSeleccionadas[key];
  var item=document.getElementById("cuota_"+key);
  var check=document.getElementById("check_"+key);
  if(cuotasSeleccionadas[key]){
    item.className="cuota-item selected";
    check.className="cuota-check checked";
    check.innerHTML='<span class="cuota-check-mark">&#x2713;</span>';
  } else {
    item.className="cuota-item";
    check.className="cuota-check";
    check.innerHTML="";
  }
  actualizarTotal();
}

function actualizarTotal() {
  var db=getDB();
  var monto=db.config.cuotaMonto;
  var cant=0;
  for(var k in cuotasSeleccionadas){if(cuotasSeleccionadas[k])cant++;}
  var total=cant*monto;
  var tmEl=document.getElementById("totalMonto");
  var csEl=document.getElementById("cantSelec");
  var btnEl=document.getElementById("btnPagarMP");
  if(tmEl) tmEl.textContent="$"+total.toLocaleString("es-AR");
  if(csEl) csEl.textContent=cant+" item"+(cant!==1?"s":"");
  if(btnEl){ if(cant>0){btnEl.removeAttribute("disabled");}else{btnEl.setAttribute("disabled","");} }
}

  if(alumnos.length===0){html+='<div class="empty-state"><div class="empty-icon">&#x1F465;</div><div>Sin alumnos cargados</div></div>';}
  else{
    for(var i=0;i<alumnos.length;i++){
      var a=alumnos[i];
      var est=estadoPago(a);
      html+='<div class="alumno-row">'+
        '<div class="alumno-info"><div class="alumno-avatar">'+a.nombre.split(" ").map(function(n){return n[0];}).join("").substring(0,2)+'</div>'+
        '<div><div class="alumno-nombre">'+a.nombre+'</div>'+
        '<div class="alumno-nivel">'+a.nivel+' | DNI: '+a.dni+'</div>'+
        '<span class="badge '+(est==="pagado"?"badge-green":"badge-red")+'" style="font-size:.65rem;">'+(est==="pagado"?"Al dia":"Debe")+'</span>'+
        '</div></div>'+
        '<div class="alumno-actions">'+
        '<button class="action-btn btn-azul" onclick="modalEditarAlumno('+a.id+')">Ver</button>'+
        '<button class="action-btn btn-rojo" onclick="eliminarAlumno('+a.id+')">X</button>'+
        '</div></div>';
    }
  }
  html+='</div>';
  return html;
}

function buildPagosAdmin() {
  var db=getDB();
  var alumnos=db.alumnos.filter(function(a){return a.activo;});
  var key=mesKey(new Date());
  var html='<div class="section-title">&#x1F4B0; Cobros - '+mesLabel(key)+'</div><div class="card">';
  for(var i=0;i<alumnos.length;i++){
    var a=alumnos[i];
    var est=estadoPago(a);
    html+='<div class="alumno-row">'+
      '<div class="alumno-info"><div class="alumno-avatar">'+a.nombre.split(" ").map(function(n){return n[0];}).join("").substring(0,2)+'</div>'+
      '<div><div class="alumno-nombre">'+a.nombre+'</div><div class="alumno-nivel">$'+db.config.cuotaMonto.toLocaleString("es-AR")+'</div></div></div>'+
      (est==="pagado"?'<span class="badge badge-green">Pagado</span>':'<button class="action-btn btn-verde" onclick="marcarPagado('+a.id+')">Cobrar</button>')+
      '</div>';
  }
  html+='</div>';
  return html;
}

function buildNovedadesAdmin() {
  var db=getDB();
  var novs=db.novedades.slice().reverse();
  var html='<div class="section-title">&#x1F4E2; Avisos</div>';
  html+='<button class="btn-submit" onclick="modalNovedad()" style="margin-bottom:12px;">+ Nueva novedad</button>';
  html+='<div class="card">';
  if(novs.length===0){html+='<div class="empty-state"><div class="empty-icon">&#x1F4ED;</div><div>Sin novedades</div></div>';}
  else{
    for(var i=0;i<novs.length;i++){
      var n=novs[i];
      html+='<div class="novedad-item" style="display:flex;justify-content:space-between;align-items:flex-start;">'+
        '<div><div class="novedad-fecha">&#x1F4C6; '+n.fecha+'</div><div class="novedad-texto">'+n.texto+'</div></div>'+
        '<button class="action-btn btn-rojo" onclick="eliminarNovedad('+n.id+')" style="margin-left:8px;flex-shrink:0;">X</button></div>';
    }
  }
  html+='</div>';
  return html;
}

function buildConfig() {
  var db=getDB();
  return '<div class="section-title">&#x2699;&#xFE0F; Configuracion</div>'+
    '<div class="card"><div class="card-title">Cuota mensual</div>'+
    '<div class="form-row"><label>Monto ($)</label><input type="number" id="cfgMonto" value="'+db.config.cuotaMonto+'"></div>'+
    '<button class="btn-submit" onclick="guardarMonto()">Guardar monto</button></div>'+
    '<div class="card"><div class="card-title">Link de Mercado Pago</div>'+
    '<p style="font-size:.78rem;color:var(--muted);margin-bottom:10px;">Pega tu link de cobro para que los alumnos puedan pagar.</p>'+
    '<div class="form-row"><label>Link MP</label><input type="text" id="cfgMP" value="'+db.config.mpLink+'" placeholder="https://mpago.la/..."></div>'+
    '<button class="btn-submit" onclick="guardarMP()">Guardar link</button></div>'+
    '<div class="card"><div class="card-title">Acceso profe</div>'+
    '<p style="font-size:.78rem;color:var(--muted);">Contrasena actual: <strong style="color:var(--text);">admin123</strong></p></div>';
}

function marcarPagado(id) {
  var db=getDB();var key=mesKey(new Date());
  for(var i=0;i<db.alumnos.length;i++){if(db.alumnos[i].id===id){db.alumnos[i].pagos[key]="pagado";break;}}
  saveDB(db);showToast("Pago registrado");showTabProfe(currentTab);
}
function eliminarAlumno(id) {
  var db=getDB();
  for(var i=0;i<db.alumnos.length;i++){if(db.alumnos[i].id===id){db.alumnos[i].activo=false;break;}}
  saveDB(db);showToast("Alumno dado de baja");showTabProfe("alumnos");
}
function eliminarNovedad(id) {
  var db=getDB();db.novedades=db.novedades.filter(function(n){return n.id!==id;});
  saveDB(db);showToast("Eliminada");showTabProfe("novedades_p");
}
function guardarMonto() {
  var db=getDB();var val=parseInt(document.getElementById("cfgMonto").value);
  if(!val||val<=0){showToast("Monto invalido");return;}
  db.config.cuotaMonto=val;saveDB(db);showToast("Monto actualizado");
}
function guardarMP() {
  var db=getDB();var link=document.getElementById("cfgMP").value.trim();
  if(!link){showToast("Ingresa el link");return;}
  db.config.mpLink=link;saveDB(db);showToast("Link guardado");
}

function modalNuevoAlumno() {
  document.getElementById("modalTitle").textContent="Nuevo Alumno";
  document.getElementById("modalBody").innerHTML=
    '<div class="form-row"><label>Nombre completo</label><input type="text" id="mNombre" placeholder="Ej: Maria Gomez"></div>'+
    '<div class="form-row"><label>DNI</label><input type="text" id="mDni" placeholder="30123456"></div>'+
    '<div class="form-row"><label>Contrasena inicial</label><input type="text" id="mPass" placeholder="1234"></div>'+
    '<div class="form-row"><label>Nivel</label><select id="mNivel"><option>Inicial</option><option>Intermedio</option><option>Avanzado</option></select></div>'+
    '<div class="form-row"><label>Horario</label><input type="text" id="mTurno" placeholder="Lunes y Miercoles 18hs"></div>'+
    '<button class="btn-submit" onclick="guardarNuevoAlumno()">Agregar</button>'+
    '<button class="btn-cancel" onclick="closeModal()">Cancelar</button>';
  openModal();
}
function guardarNuevoAlumno() {
  var nombre=document.getElementById("mNombre").value.trim();
  var dni=document.getElementById("mDni").value.trim();
  var pass=document.getElementById("mPass").value.trim();
  var nivel=document.getElementById("mNivel").value;
  var turno=document.getElementById("mTurno").value.trim();
  if(!nombre||!dni||!pass){showToast("Completa todos los campos");return;}
  var db=getDB();var maxId=0;
  for(var i=0;i<db.alumnos.length;i++){if(db.alumnos[i].id>maxId)maxId=db.alumnos[i].id;}
  db.alumnos.push({id:maxId+1,nombre:nombre,dni:dni,pass:pass,nivel:nivel,turno:turno,pagos:{},activo:true});
  saveDB(db);closeModal();showToast("Alumno agregado");showTabProfe("alumnos");
}
function modalEditarAlumno(id) {
  var db=getDB();var alumno=null;
  for(var i=0;i<db.alumnos.length;i++){if(db.alumnos[i].id===id){alumno=db.alumnos[i];break;}}
  if(!alumno)return;
  var key=mesKey(new Date());var est=estadoPago(alumno);
  var tel=alumno.telefono||"";
  document.getElementById("modalTitle").textContent=alumno.nombre;
  document.getElementById("modalBody").innerHTML=
    '<p style="font-size:.8rem;color:var(--muted);margin-bottom:8px;">DNI: '+alumno.dni+' | '+alumno.nivel+'</p>'+
    '<p style="font-size:.8rem;color:var(--muted);margin-bottom:4px;">Horario: '+alumno.turno+'</p>'+
    (tel?'<p style="font-size:.8rem;color:var(--muted);margin-bottom:14px;">&#x1F4F1; '+tel+
    ' <a href="https://wa.me/54'+tel+'" target="_blank" style="color:var(--green);font-weight:700;margin-left:8px;">WhatsApp</a></p>':
    '<p style="font-size:.8rem;color:var(--muted);margin-bottom:14px;">Sin numero de WhatsApp</p>')+
    '<div style="margin-bottom:14px;"><strong style="font-size:.82rem;">'+mesLabel(key)+':</strong> '+
    '<span class="badge '+(est==="pagado"?"badge-green":"badge-red")+'">'+(est==="pagado"?"Pagado":"Pendiente")+'</span></div>'+
    (est!=="pagado"?'<button class="btn-submit" onclick="marcarPagado('+id+');closeModal();" style="margin-bottom:8px;">Marcar como pagado</button>':'')+
    '<button class="btn-cancel" onclick="closeModal()">Cerrar</button>';
  openModal();
}
function modalNovedad() {
  var hoy=new Date();
  var f=hoy.getFullYear()+"-"+String(hoy.getMonth()+1).padStart(2,"0")+"-"+String(hoy.getDate()).padStart(2,"0");
  document.getElementById("modalTitle").textContent="Nueva Novedad";
  document.getElementById("modalBody").innerHTML=
    '<div class="form-row"><label>Fecha</label><input type="date" id="nFecha" value="'+f+'"></div>'+
    '<div class="form-row"><label>Mensaje</label><textarea id="nTexto" placeholder="Escribe el aviso..."></textarea></div>'+
    '<button class="btn-submit" onclick="guardarNovedad()">Publicar</button>'+
    '<button class="btn-cancel" onclick="closeModal()">Cancelar</button>';
  openModal();
}
function guardarNovedad() {
  var fecha=document.getElementById("nFecha").value;
  var texto=document.getElementById("nTexto").value.trim();
  if(!texto){showToast("Escribe el mensaje");return;}
  var db=getDB();var maxId=0;
  for(var i=0;i<db.novedades.length;i++){if(db.novedades[i].id>maxId)maxId=db.novedades[i].id;}
  db.novedades.push({id:maxId+1,texto:texto,fecha:fecha});
  saveDB(db);closeModal();showToast("Publicada");showTabProfe("novedades_p");
}
function openModal(){document.getElementById("modalOverlay").style.display="flex";}
function closeModal(){document.getElementById("modalOverlay").style.display="none";}
function showToast(msg){var t=document.getElementById("toast");t.textContent=msg;t.style.display="block";setTimeout(function(){t.style.display="none";},2200);}

function resetearDatos(){
  localStorage.clear();
  sessionStorage.clear();
  showToast("Datos reseteados");
  setTimeout(function(){location.reload();},800);
}

window.onload=function(){
  // PWA: registrar service worker si el browser lo soporta
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  }
  runSplash();
};
</script>
</body>
</html>
