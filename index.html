<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cultura Física Villegas</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0a0f;
  --surface:#12121a;
  --card:#1a1a26;
  --border:#252535;
  --accent:#3d8ef8;
  --accent2:#5ba3ff;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#f59e0b;
  --text:#e8e8f0;
  --muted:#7070a0;
  --white:#ffffff;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;}

/* SPLASH */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
#splash img{width:120px;height:120px;border-radius:50%;margin-bottom:20px;border:3px solid var(--accent);}
#splash h1{font-size:1.6rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--white);}
#splash p{color:var(--muted);margin-top:6px;font-size:.9rem;letter-spacing:1px;}
.splash-bar{width:200px;height:3px;background:var(--border);border-radius:2px;margin-top:30px;overflow:hidden;}
.splash-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width 1.2s ease;}

/* LOGIN */
#loginScreen{display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;padding:20px;}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px 28px;width:100%;max-width:360px;}
.login-logo{text-align:center;margin-bottom:24px;}
.login-logo img{width:80px;height:80px;border-radius:50%;border:2px solid var(--accent);}
.login-logo h2{margin-top:12px;font-size:1.1rem;font-weight:700;letter-spacing:1px;color:var(--white);}
.login-logo p{color:var(--muted);font-size:.8rem;margin-top:4px;}
.role-tabs{display:flex;background:var(--surface);border-radius:10px;padding:4px;margin-bottom:24px;}
.role-tab{flex:1;padding:10px;text-align:center;border-radius:7px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted);border:none;background:transparent;transition:all .2s;}
.role-tab.active{background:var(--accent);color:var(--white);}
.inp-group{margin-bottom:16px;}
.inp-group label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
.inp-group input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-size:.95rem;outline:none;transition:border .2s;}
.inp-group input:focus{border-color:var(--accent);}
.btn-primary{width:100%;background:var(--accent);color:var(--white);border:none;border-radius:10px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:background .2s;}
.btn-primary:hover{background:var(--accent2);}
.login-error{color:var(--red);font-size:.82rem;text-align:center;margin-top:10px;display:none;}

/* APP SHELL */
#appShell{display:none;min-height:100vh;flex-direction:column;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar-left img{width:36px;height:36px;border-radius:50%;border:2px solid var(--accent);}
.topbar-title{font-size:.95rem;font-weight:700;color:var(--white);}
.topbar-sub{font-size:.75rem;color:var(--muted);}
.topbar-right{display:flex;gap:8px;}
.icon-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.main-content{flex:1;padding:18px;max-width:600px;margin:0 auto;width:100%;}
.bottom-nav{background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0;position:sticky;bottom:0;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:.7rem;font-weight:600;border:none;background:transparent;transition:color .2s;}
.nav-item.active{color:var(--accent);}
.nav-icon{font-size:1.3rem;}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;}
.card-title{font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.section-title{font-size:1.1rem;font-weight:800;color:var(--white);margin-bottom:14px;display:flex;align-items:center;gap:8px;}

/* CARNET ALUMNO */
.carnet{background:linear-gradient(135deg,#1a2a4a 0%,#0d1b35 50%,#1a1a26 100%);border:1px solid var(--accent);border-radius:16px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden;}
.carnet::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:radial-gradient(circle,rgba(61,142,248,.2),transparent 70%);border-radius:50%;}
.carnet-header{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.carnet-avatar{width:52px;height:52px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;color:var(--white);border:2px solid rgba(255,255,255,.2);}
.carnet-name{font-size:1.1rem;font-weight:800;color:var(--white);}
.carnet-badge{display:inline-block;background:rgba(61,142,248,.2);border:1px solid var(--accent);color:var(--accent);font-size:.7rem;font-weight:700;padding:2px 10px;border-radius:20px;margin-top:4px;}
.carnet-footer{display:flex;justify-content:space-between;align-items:flex-end;}
.carnet-info{font-size:.72rem;color:var(--muted);}
.carnet-info strong{display:block;color:var(--white);font-size:.9rem;margin-top:2px;}
.carnet-logo{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.2);}

/* ESTADO PAGO */
.pago-card{border-radius:12px;padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.pago-al-dia{background:rgba(34,197,94,.1);border:1px solid var(--green);}
.pago-pendiente{background:rgba(239,68,68,.1);border:1px solid var(--red);}
.pago-proximo{background:rgba(245,158,11,.1);border:1px solid var(--yellow);}
.badge{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px;}
.badge-green{background:rgba(34,197,94,.2);color:var(--green);}
.badge-red{background:rgba(239,68,68,.2);color:var(--red);}
.badge-yellow{background:rgba(245,158,11,.2);color:var(--yellow);}

/* BOTÓN PAGAR */
.btn-pagar{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#009EE3,#00b4f0);color:var(--white);border:none;border-radius:12px;padding:16px 20px;font-size:1rem;font-weight:700;cursor:pointer;width:100%;margin-top:8px;justify-content:center;transition:opacity .2s;}
.btn-pagar:hover{opacity:.9;}
.btn-pagar-icon{font-size:1.3rem;}

/* LISTA ALUMNOS (admin) */
.alumno-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.alumno-row:last-child{border-bottom:none;}
.alumno-info{display:flex;align-items:center;gap:10px;}
.alumno-avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:var(--white);}
.alumno-nombre{font-size:.92rem;font-weight:700;color:var(--text);}
.alumno-nivel{font-size:.75rem;color:var(--muted);}
.alumno-actions{display:flex;gap:6px;}
.action-btn{border:none;border-radius:7px;padding:6px 12px;font-size:.75rem;font-weight:700;cursor:pointer;transition:opacity .2s;}
.btn-verde{background:rgba(34,197,94,.15);color:var(--green);border:1px solid var(--green);}
.btn-rojo{background:rgba(239,68,68,.15);color:var(--red);border:1px solid var(--red);}
.btn-azul{background:rgba(61,142,248,.15);color:var(--accent);border:1px solid var(--accent);}

/* STATS ADMIN */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
.stat-num{font-size:1.8rem;font-weight:800;color:var(--accent);}
.stat-label{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;margin-top:2px;}
.stat-green .stat-num{color:var(--green);}
.stat-red .stat-num{color:var(--red);}
.stat-yellow .stat-num{color:var(--yellow);}

/* NOVEDADES */
.novedad-item{padding:12px 0;border-bottom:1px solid var(--border);}
.novedad-item:last-child{border-bottom:none;}
.novedad-fecha{font-size:.72rem;color:var(--accent);font-weight:700;margin-bottom:3px;}
.novedad-texto{font-size:.88rem;color:var(--text);}

/* FORMULARIOS */
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:.75rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.form-row input, .form-row select, .form-row textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 13px;color:var(--text);font-size:.9rem;outline:none;transition:border .2s;}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus{border-color:var(--accent);}
.form-row textarea{resize:vertical;min-height:80px;}
.form-row select option{background:var(--surface);}
.btn-submit{background:var(--accent);color:var(--white);border:none;border-radius:10px;padding:13px 20px;font-size:.92rem;font-weight:700;cursor:pointer;width:100%;}
.btn-cancel{background:var(--surface);color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:13px 20px;font-size:.92rem;font-weight:700;cursor:pointer;width:100%;margin-top:8px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:1rem;font-weight:800;color:var(--white);margin-bottom:18px;}

/* MISC */
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-icon{font-size:2.5rem;margin-bottom:10px;}
.text-muted{color:var(--muted);font-size:.85rem;}
.hidden{display:none !important;}
.flex-center{display:flex;align-items:center;gap:8px;}
.mt-8{margin-top:8px;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--white);padding:10px 22px;border-radius:30px;font-size:.85rem;font-weight:700;z-index:1000;display:none;white-space:nowrap;}
</style>
</head>
<body>



<!-- SPLASH -->
<div id="splash">
  <img id="splashLogo" src="" alt="Logo">
  <h1>Cultura Física</h1>
  <p>Villegas</p>
  <div class="splash-bar"><div class="splash-fill" id="splashFill"></div></div>
</div>

<!-- LOGIN -->
<div id="loginScreen" style="display:none;min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;">
  <div class="login-box">
    <div class="login-logo">
      <img id="loginLogo" src="" alt="Logo">
      <h2>Cultura Física</h2>
      <p>Villegas</p>
    </div>
    <div class="role-tabs">
      <button class="role-tab active" id="tabProfe" onclick="setRole('profe')">Profe</button>
      <button class="role-tab" id="tabAlumno" onclick="setRole('alumno')">Alumno</button>
    </div>
    <div id="loginForm">
      <div class="inp-group" id="grpUser">
        <label>Usuario o DNI</label>
        <input type="text" id="inpUser" placeholder="Ingresá tu usuario">
      </div>
      <div class="inp-group">
        <label>Contraseña</label>
        <input type="password" id="inpPass" placeholder="Contraseña">
      </div>
      <button class="btn-primary" onclick="doLogin()">Ingresar</button>
      <p class="login-error" id="loginErr">Usuario o contraseña incorrectos</p>
    </div>
  </div>
</div>

<!-- APP SHELL -->
<div id="appShell" style="display:none;flex-direction:column;min-height:100vh;">
  <div class="topbar">
    <div class="topbar-left">
      <img id="topLogo" src="" alt="">
      <div>
        <div class="topbar-title" id="topTitle">Cultura Física</div>
        <div class="topbar-sub" id="topSub">Villegas</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="icon-btn" onclick="doLogout()" title="Salir">&#x2715;</div>
    </div>
  </div>

  <div class="main-content" id="mainContent"></div>

  <div class="bottom-nav" id="bottomNav"></div>
</div>

<div class="toast" id="toast"></div>

<!-- MODAL GLOBAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalBody"></div>
  </div>
</div>

var DB_KEY = "cfv_db";
var SESSION_KEY = "cfv_session";
var currentRole = "profe";
var currentUser = null;
var currentTab = "";

// ===== BASE DE DATOS LOCAL =====
function getDB() {
  var raw = localStorage.getItem(DB_KEY);
  if (!raw) return initDB();
  return JSON.parse(raw);
}

function saveDB(db) {
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}

function initDB() {
  var db = {
    config: {
      mpLink: "https://mpago.la/TU_LINK_AQUI",
      cuotaMonto: 8000,
      nombreGimnasio: "Cultura Fisica Villegas"
    },
    alumnos: [
      {id:1, nombre:"Maria Gomez", dni:"30123456", pass:"1234", nivel:"Inicial", turno:"Lunes y Miercoles 18hs", pagos:{}, activo:true},
      {id:2, nombre:"Lucas Perez", dni:"32456789", pass:"1234", nivel:"Intermedio", turno:"Martes y Jueves 17hs", pagos:{}, activo:true},
      {id:3, nombre:"Sofia Torres", dni:"35789012", pass:"1234", nivel:"Avanzado", turno:"Lunes y Miercoles 19hs", pagos:{}, activo:true}
    ],
    novedades: [
      {id:1, texto:"Bienvenidos al nuevo sistema de gestion del gimnasio", fecha:"2026-06-01"},
      {id:2, texto:"Este mes no hay clases el dia 20 de junio", fecha:"2026-06-10"}
    ]
  };
  var hoy = mesKey(new Date());
  db.alumnos[0].pagos[hoy] = "pagado";
  db.alumnos[2].pagos[hoy] = "pagado";
  saveDB(db);
  return db;
}

function mesKey(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}

function mesLabel(key) {
  var meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  var p = key.split("-");
  return meses[parseInt(p[1])-1] + " " + p[0];
}

function estadoPago(alumno) {
  var key = mesKey(new Date());
  return alumno.pagos[key] || "pendiente";
}

// ===== SESION =====
function getSession() {
  var raw = sessionStorage.getItem(SESSION_KEY);
  return raw ? JSON.parse(raw) : null;
}

function saveSession(s) {
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(s));
}

// ===== LOGO =====
function setLogos() {
  var imgs = document.querySelectorAll("img[id$='Logo'], #topLogo, #carnetLogoImg");
  for (var i=0; i<imgs.length; i++) {
    imgs[i].src = LOGO_SRC;
  }
}

// ===== SPLASH =====
function runSplash() {
  setLogos();
  document.getElementById("splashLogo").src = LOGO_SRC;
  var fill = document.getElementById("splashFill");
  setTimeout(function(){ fill.style.width = "100%"; }, 100);
  setTimeout(function(){
    var sess = getSession();
    if (sess) {
      currentUser = sess;
      showApp();
    } else {
      document.getElementById("splash").style.display = "none";
      var ls = document.getElementById("loginScreen");
      ls.style.display = "flex";
      document.getElementById("loginLogo").src = LOGO_SRC;
    }
  }, 1500);
}

// ===== LOGIN =====
function setRole(r) {
  currentRole = r;
  document.getElementById("tabProfe").className = "role-tab" + (r==="profe"?" active":"");
  document.getElementById("tabAlumno").className = "role-tab" + (r==="alumno"?" active":"");
  document.getElementById("grpUser").style.display = r==="alumno" ? "block" : "none";
  document.getElementById("inpUser").value = "";
  document.getElementById("inpPass").value = "";
  document.getElementById("loginErr").style.display = "none";
  if (r==="profe") {
    document.getElementById("grpUser").style.display = "none";
  } else {
    document.getElementById("grpUser").style.display = "block";
    document.getElementById("grpUser").querySelector("label").textContent = "DNI";
    document.getElementById("inpUser").placeholder = "Tu numero de DNI";
  }
}

function doLogin() {
  var pass = document.getElementById("inpPass").value;
  var err = document.getElementById("loginErr");
  err.style.display = "none";

  if (currentRole === "profe") {
    if (pass === "admin123") {
      currentUser = {role:"profe", nombre:"Profe Admin"};
      saveSession(currentUser);
      showApp();
    } else {
      err.style.display = "block";
    }
  } else {
    var dni = document.getElementById("inpUser").value;
    var db = getDB();
    var found = null;
    for (var i=0; i<db.alumnos.length; i++) {
      if (db.alumnos[i].dni === dni && db.alumnos[i].pass === pass && db.alumnos[i].activo) {
        found = db.alumnos[i];
        break;
      }
    }
    if (found) {
      currentUser = {role:"alumno", id:found.id, nombre:found.nombre};
      saveSession(currentUser);
      showApp();
    } else {
      err.style.display = "block";
    }
  }
}

function doLogout() {
  sessionStorage.removeItem(SESSION_KEY);
  currentUser = null;
  document.getElementById("appShell").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("inpPass").value = "";
  document.getElementById("inpUser").value = "";
  setRole("profe");
}

// ===== APP SHELL =====
function showApp() {
  document.getElementById("splash").style.display = "none";
  document.getElementById("loginScreen").style.display = "none";
  var app = document.getElementById("appShell");
  app.style.display = "flex";
  document.getElementById("topLogo").src = LOGO_SRC;

  if (currentUser.role === "profe") {
    document.getElementById("topTitle").textContent = "Cultura Fisica";
    document.getElementById("topSub").textContent = "Panel Profe";
    buildNavProfe();
    showTabProfe("dashboard");
  } else {
    document.getElementById("topTitle").textContent = "Cultura Fisica";
    document.getElementById("topSub").textContent = currentUser.nombre;
    buildNavAlumno();
    showTabAlumno("carnet");
  }
}

}

// ===== VISTAS ALUMNO =====
function buildCarnet() {
  var db = getDB();
  var alumno = null;
  for (var i=0; i<db.alumnos.length; i++) {
    if (db.alumnos[i].id === currentUser.id) { alumno = db.alumnos[i]; break; }
  }
  if (!alumno) return "<p>Error cargando datos</p>";
  var iniciales = alumno.nombre.split(" ").map(function(n){ return n[0]; }).join("").substring(0,2).toUpperCase();
  var estado = estadoPago(alumno);
  var estadoHtml = estado==="pagado"
    ? '<span class="badge badge-green">Al dia</span>'
    : '<span class="badge badge-red">Pendiente</span>';
  var hoy = new Date();
  var mesActual = mesLabel(mesKey(hoy));

  return '<div class="carnet">' +
    '<div class="carnet-header">' +
    '<div class="carnet-avatar">' + iniciales + '</div>' +
    '<div>' +
    '<div class="carnet-name">' + alumno.nombre + '</div>' +
    '<span class="carnet-badge">ACTIVO</span>' +
    '</div>' +
    '<img src="' + LOGO_SRC + '" class="carnet-logo" style="margin-left:auto">' +
    '</div>' +
    '<div style="margin-bottom:14px;font-size:.8rem;color:rgba(255,255,255,.6);border-top:1px solid rgba(255,255,255,.1);padding-top:12px;">' +
    '<div style="display:flex;gap:24px;">' +
    '<div><div style="font-size:.68rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px;">Nivel</div><div style="color:#fff;font-weight:700;margin-top:2px;">' + alumno.nivel + '</div></div>' +
    '<div><div style="font-size:.68rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px;">Horario</div><div style="color:#fff;font-weight:700;margin-top:2px;">' + alumno.turno + '</div></div>' +
    '</div></div>' +
    '<div class="carnet-footer">' +
    '<div><div class="carnet-info">DNI <strong>' + alumno.dni + '</strong></div>' +
    '<div class="carnet-info" style="margin-top:6px;">' + mesActual + ' ' + estadoHtml + '</div></div>' +
    '</div></div>' +
    '<div class="card">' +
    '<div class="card-title">Gimnasio</div>' +
    '<div style="font-size:.9rem;color:var(--text);">Cultura Fisica Villegas</div>' +
    '<div style="font-size:.8rem;color:var(--muted);margin-top:4px;">Gimnasia Artistica</div>' +
    '</div>';
}

function buildMiPago() {
  var db = getDB();
  var alumno = null;
  for (var i=0; i<db.alumnos.length; i++) {
    if (db.alumnos[i].id === currentUser.id) { alumno = db.alumnos[i]; break; }
  }
  if (!alumno) return "<p>Error</p>";
  var hoy = new Date();
  var key = mesKey(hoy);
  var estado = estadoPago(alumno);
  var mes = mesLabel(key);
  var monto = db.config.cuotaMonto;

  var estadoBlk = "";
  if (estado==="pagado") {
    estadoBlk = '<div class="pago-card pago-al-dia">' +
      '<div><div style="font-weight:700;color:var(--white);">Cuota ' + mes + '</div>' +
      '<div style="font-size:.8rem;color:var(--muted);margin-top:3px;">Ya esta pagada</div></div>' +
      '<span class="badge badge-green">Al dia</span>' +
      '</div>' +
      '<div class="card" style="text-align:center;">' +
      '<div style="font-size:2rem;">&#x2705;</div>' +
      '<div style="font-weight:700;color:var(--green);margin-top:8px;">Pago registrado</div>' +
      '<div style="font-size:.82rem;color:var(--muted);margin-top:4px;">Gracias por mantenerte al dia</div>' +
      '</div>';
  } else {
    estadoBlk = '<div class="pago-card pago-pendiente">' +
      '<div><div style="font-weight:700;color:var(--white);">Cuota ' + mes + '</div>' +
      '<div style="font-size:.8rem;color:var(--muted);margin-top:3px;">Vence a fin de mes</div></div>' +
      '<span class="badge badge-red">Pendiente</span>' +
      '</div>' +
      '<div class="card">' +
      '<div class="card-title">Total a pagar</div>' +
      '<div style="font-size:1.8rem;font-weight:800;color:var(--white);">$' + monto.toLocaleString("es-AR") + '</div>' +
      '<div style="font-size:.8rem;color:var(--muted);margin-top:4px;">Cuota mensual - ' + mes + '</div>' +
      '<button class="btn-pagar" onclick="pagarMP()" style="margin-top:16px;">' +
      '<span class="btn-pagar-icon">&#x1F4B3;</span> Pagar con Mercado Pago' +
      '</button>' +
      '</div>';
  }

  var histHtml = '<div class="card"><div class="card-title">Historial</div>';
  var keys = Object.keys(alumno.pagos).sort().reverse();
  if (keys.length===0) {
    histHtml += '<div class="empty-state"><div class="empty-icon">&#x1F4C5;</div><div>Sin pagos registrados</div></div>';
  } else {
    for (var i=0; i<Math.min(keys.length,6); i++) {
      var k = keys[i];
      var v = alumno.pagos[k];
      histHtml += '<div class="alumno-row">' +
        '<div><div style="font-size:.88rem;font-weight:700;">' + mesLabel(k) + '</div></div>' +
        '<span class="badge ' + (v==="pagado"?"badge-green":"badge-red") + '">' + (v==="pagado"?"Pagado":"Pendiente") + '</span>' +
        '</div>';
    }
  }
  histHtml += '</div>';

  return '<div class="section-title">&#x1F4B0; Mi Cuota</div>' + estadoBlk + histHtml;
}

// ===== VISTAS PROFE =====
function buildDashboard() {
  var db = getDB();
  var alumnos = db.alumnos.filter(function(a){ return a.activo; });
  var key = mesKey(new Date());
  var pagados = alumnos.filter(function(a){ return a.pagos[key]==="pagado"; });
  var pendientes = alumnos.filter(function(a){ return a.pagos[key]!=="pagado"; });
  var total = pagados.length * db.config.cuotaMonto;

  var html = '<div class="section-title">&#x1F4CA; Resumen ' + mesLabel(key) + '</div>';
  html += '<div class="stats-grid">';
  html += '<div class="stat-card"><div class="stat-num">' + alumnos.length + '</div><div class="stat-label">Alumnos</div></div>';
  html += '<div class="stat-card stat-green"><div class="stat-num">' + pagados.length + '</div><div class="stat-label">Al dia</div></div>';
  html += '<div class="stat-card stat-red"><div class="stat-num">' + pendientes.length + '</div><div class="stat-label">Pendientes</div></div>';
  html += '<div class="stat-card stat-yellow"><div class="stat-num">$' + (total/1000).toFixed(0) + 'K</div><div class="stat-label">Cobrado</div></div>';
  html += '</div>';

  if (pendientes.length > 0) {
    html += '<div class="card"><div class="card-title">&#x26A0; Deben este mes</div>';
    for (var i=0; i<pendientes.length; i++) {
      var a = pendientes[i];
      html += '<div class="alumno-row">' +
        '<div class="alumno-info">' +
        '<div class="alumno-avatar">' + a.nombre.split(" ").map(function(n){return n[0];}).join("").substring(0,2) + '</div>' +
        '<div><div class="alumno-nombre">' + a.nombre + '</div><div class="alumno-nivel">' + a.nivel + '</div></div>' +
        '</div>' +
        '<button class="action-btn btn-verde" onclick="marcarPagado(' + a.id + ')">Marcar pagado</button>' +
        '</div>';
    }
    html += '</div>';
  }

  var novsRecientes = db.novedades.slice(-3).reverse();
  html += '<div class="card"><div class="card-title">Ultimas novedades</div>';
  if (novsRecientes.length===0) {
    html += '<div class="text-muted" style="text-align:center;padding:10px;">Sin novedades</div>';
  } else {
    for (var j=0; j<novsRecientes.length; j++) {
      html += '<div class="novedad-item"><div class="novedad-fecha">' + novsRecientes[j].fecha + '</div>' +
        '<div class="novedad-texto">' + novsRecientes[j].texto + '</div></div>';
    }
  }
  html += '</div>';
  return html;
}

// ===== ACCIONES PROFE =====
function marcarPagado(id) {
  var db = getDB();
  var key = mesKey(new Date());
  for (var i=0; i<db.alumnos.length; i++) {
    if (db.alumnos[i].id===id) {
      db.alumnos[i].pagos[key] = "pagado";
      break;
    }
  }
  saveDB(db);
  showToast("Pago registrado");
  showTabProfe(currentTab);
}

function eliminarAlumno(id) {
  var db = getDB();
  for (var i=0; i<db.alumnos.length; i++) {
    if (db.alumnos[i].id===id) {
      db.alumnos[i].activo = false;
      break;
    }
  }
  saveDB(db);
  showToast("Alumno dado de baja");
  showTabProfe("alumnos");
}

function eliminarNovedad(id) {
  var db = getDB();
  db.novedades = db.novedades.filter(function(n){ return n.id!==id; });
  saveDB(db);
  showToast("Novedad eliminada");
  showTabProfe("novedades_p");
}

function guardarMonto() {
  var db = getDB();
  var val = parseInt(document.getElementById("cfgMonto").value);
  if (!val || val<=0) { showToast("Monto invalido"); return; }
  db.config.cuotaMonto = val;
  saveDB(db);
  showToast("Monto actualizado");
}

function guardarMP() {
  var db = getDB();
  var link = document.getElementById("cfgMP").value.trim();
  if (!link) { showToast("Ingresa el link"); return; }
  db.config.mpLink = link;
  saveDB(db);
  showToast("Link de MP guardado");
}

// ===== MODALES =====
function modalNuevoAlumno() {
  document.getElementById("modalTitle").textContent = "Nuevo Alumno";
  document.getElementById("modalBody").innerHTML =
    '<div class="form-row"><label>Nombre completo</label><input type="text" id="mNombre" placeholder="Ej: Maria Gomez"></div>' +
    '<div class="form-row"><label>DNI (usuario de acceso)</label><input type="text" id="mDni" placeholder="30123456"></div>' +
    '<div class="form-row"><label>Contrasena inicial</label><input type="text" id="mPass" placeholder="Ej: 1234"></div>' +
    '<div class="form-row"><label>Nivel</label><select id="mNivel"><option>Inicial</option><option>Intermedio</option><option>Avanzado</option></select></div>' +
    '<div class="form-row"><label>Horario / Turno</label><input type="text" id="mTurno" placeholder="Ej: Lunes y Miercoles 18hs"></div>' +
    '<button class="btn-submit" onclick="guardarNuevoAlumno()">Agregar alumno</button>' +
    '<button class="btn-cancel" onclick="closeModal()">Cancelar</button>';
  openModal();
}

function guardarNuevoAlumno() {
  var nombre = document.getElementById("mNombre").value.trim();
  var dni = document.getElementById("mDni").value.trim();
  var pass = document.getElementById("mPass").value.trim();
  var nivel = document.getElementById("mNivel").value;
  var turno = document.getElementById("mTurno").value.trim();
  if (!nombre || !dni || !pass) { showToast("Completa todos los campos"); return; }
  var db = getDB();
  var maxId = 0;
  for (var i=0; i<db.alumnos.length; i++) { if (db.alumnos[i].id>maxId) maxId=db.alumnos[i].id; }
  db.alumnos.push({id:maxId+1, nombre:nombre, dni:dni, pass:pass, nivel:nivel, turno:turno, pagos:{}, activo:true});
  saveDB(db);
  closeModal();
  showToast("Alumno agregado");
  showTabProfe("alumnos");
}

function modalEditarAlumno(id) {
  var db = getDB();
  var alumno = null;
  for (var i=0; i<db.alumnos.length; i++) { if (db.alumnos[i].id===id){ alumno=db.alumnos[i]; break; } }
  if (!alumno) return;
  var key = mesKey(new Date());
  var est = estadoPago(alumno);
  document.getElementById("modalTitle").textContent = alumno.nombre;
  document.getElementById("modalBody").innerHTML =
    '<p style="font-size:.82rem;color:var(--muted);margin-bottom:12px;">DNI: ' + alumno.dni + ' | ' + alumno.nivel + '</p>' +
    '<p style="font-size:.82rem;color:var(--muted);margin-bottom:16px;">Horario: ' + alumno.turno + '</p>' +
    '<div style="margin-bottom:16px;"><strong style="font-size:.85rem;">Estado ' + mesLabel(key) + ':</strong> ' +
    '<span class="badge ' + (est==="pagado"?"badge-green":"badge-red") + '">' + (est==="pagado"?"Pagado":"Pendiente") + '</span></div>' +
    (est!=="pagado" ? '<button class="btn-submit" onclick="marcarPagado('+id+');closeModal();" style="margin-bottom:8px;">Marcar como pagado</button>' : '') +
    '<button class="btn-cancel" onclick="closeModal()">Cerrar</button>';
  openModal();
}

function modalNovedad() {
  var hoy = new Date();
  var fechaDefault = hoy.getFullYear() + "-" + String(hoy.getMonth()+1).padStart(2,"0") + "-" + String(hoy.getDate()).padStart(2,"0");
  document.getElementById("modalTitle").textContent = "Nueva Novedad";
  document.getElementById("modalBody").innerHTML =
    '<div class="form-row"><label>Fecha</label><input type="date" id="nFecha" value="' + fechaDefault + '"></div>' +
    '<div class="form-row"><label>Mensaje</label><textarea id="nTexto" placeholder="Escribe el aviso aqui..."></textarea></div>' +
    '<button class="btn-submit" onclick="guardarNovedad()">Publicar</button>' +
    '<button class="btn-cancel" onclick="closeModal()">Cancelar</button>';
  openModal();
}

function guardarNovedad() {
  var fecha = document.getElementById("nFecha").value;
  var texto = document.getElementById("nTexto").value.trim();
  if (!texto) { showToast("Escribe el mensaje"); return; }
  var db = getDB();
  var maxId = 0;
  for (var i=0; i<db.novedades.length; i++) { if (db.novedades[i].id>maxId) maxId=db.novedades[i].id; }
  db.novedades.push({id:maxId+1, texto:texto, fecha:fecha});
  saveDB(db);
  closeModal();
  showToast("Novedad publicada");
  showTabProfe("novedades_p");
}

function openModal() {
  document.getElementById("modalOverlay").style.display = "flex";
}

function closeModal() {
  document.getElementById("modalOverlay").style.display = "none";
}

// ===== TOAST =====
function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(function(){ t.style.display = "none"; }, 2200);
}

// ===== INIT =====
window.onload = function() {
  runSplash();
};
